<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>FlyPet 视觉关联实验</title><style>
*{box-sizing:border-box}body{font:16px "Microsoft YaHei",sans-serif;background:#101b1c;color:#e0e9de;max-width:1200px;margin:28px auto;padding:0 20px}h1{font-size:26px}p{line-height:1.7;color:#bfcebd}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{padding:12px;background:#263e3a;border:1px solid #53655c;color:#e0e9de;border-radius:8px;font:inherit}#pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}.card{padding:14px;border:2px solid #314642;border-radius:12px;background:#182927}.chosen{border-color:#e3ac5f}.card img{width:100%;border-radius:6px}.value{font-size:22px;color:#e3ac5f;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.grid img{width:100%}.tile{background:#182927;padding:8px;border-radius:8px}.bar{height:7px;background:#e3ac5f;margin-top:8px}small{color:#a6bcad}h2{font-size:19px;margin-top:30px}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}
</style><h1>它能记住“这张封面带来糖水”吗？</h1><p>使用你提供的页面像素，经官方 flyvis 视觉模型，再接入实验性学习接口。训练只展示两张封面，糖水配对 5 次；测试不再给奖励。下面是实际模型评分，没有预设爬行轨迹。</p>
<div class="controls"><label>查看条件 <select id="mode"><option value="reward_B">给美食封面 B 配对糖水</option><option value="frozen">冻结学习：相同经历</option><option value="reward_A">对照：改给人物封面 A 糖水</option></select></label><button id="swap">交换左右位置</button></div><div id="verdict"></div><div id="pair"></div>
<h2>同页其他封面的反应</h2><p><small>以下其余图片未参与配对训练。数值是 16 个随机种子的平均趋近读出，单位任意；不是食物概率。没有向模型提供标题、食物标签或封面位置。浅层相似性不等于食物类别识别。</small></p><div id="grid" class="grid"></div>
<p>交换位置只验证画面评分不依赖展示槽位；当前没有主动扫描、定位或驱动桌面苍蝇。A/B 初始都没有偏好；人物封面也能被奖励训练成偏好对象。</p><script>
const report=__DATA__,mode=document.getElementById('mode');let swapped=false;
function draw(){const r=report.summary[mode.value],v=r.mean_scores;const ids=swapped?[5,3]:[3,5];const winner=Math.abs(v[5]-v[3])<1e-9?-1:v[5]>v[3]?5:3;
document.getElementById('verdict').innerHTML='<p><b>'+(winner<0?'未形成 A/B 偏好':('当前偏向 '+(winner===5?'B：美食封面':'A：人物讲课封面')))+ '</b> · '+(mode.value==='reward_B'?'16/16 个种子偏向 B；亮度降低 15% 后为 16/16':mode.value==='reward_A'?'16/16 个种子偏向 A':'学习被冻结，所有封面读出为 0')+'</p>';
document.getElementById('pair').innerHTML=ids.map(i=>'<div class="card '+(i===winner?'chosen':'')+'"><h2>'+(i===5?'B · 原首排第 6 张':'A · 原首排第 4 张')+'</h2><img src="cover-'+(i+1)+'.png"><div class="value">趋近读出 '+v[i].toFixed(3)+'</div><small>'+(i===winner?'模型评分较高':'')+'</small></div>').join('');
const max=Math.max(...v,.001);document.getElementById('grid').innerHTML=v.map((x,i)=>'<div class="tile"><img src="cover-'+(i+1)+'.png"><small>封面 '+(i+1)+' · '+x.toFixed(3)+'</small><div class="bar" style="width:'+Math.max(0,x/max*100)+'%"></div></div>').join('');}
mode.onchange=draw;document.getElementById('swap').onclick=()=>{swapped=!swapped;draw()};draw();</script></html>
